<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5a8f" />
    <title>Update TR Eq</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf5fa; color: #073c64; font-family: system-ui, sans-serif; }
      main { width: min(88vw, 420px); padding: 32px; border-radius: 24px; background: white; box-shadow: 0 18px 50px #0b5a8f22; text-align: center; }
      img { width: 76px; height: 76px; border-radius: 20px; }
      h1 { margin: 18px 0 10px; font-size: 25px; }
      p { margin: 0; color: #4f718a; line-height: 1.5; }
      strong { display: block; margin-top: 20px; color: #008b7c; }
    </style>
  </head>
  <body>
    <main>
      <img src="./tr-eq-192.png" alt="TR Eq" />
      <h1>Updating TR Eq safely</h1>
      <p>Your projects, photos, and customer information are not being removed.</p>
      <strong id="status">Removing the obsolete app screen…</strong>
    </main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(key => key.startsWith("tr-eq-field-")).map(key => caches.delete(key)));
          }
          document.getElementById("status").textContent = "Update complete — opening the protected app…";
          setTimeout(() => location.replace("https://scuratol67.github.io/tr-eq-mobile-field-test/?look=v58"), 900);
        } catch (error) {
          document.getElementById("status").textContent = "Please close this page and open it once more.";
        }
      })();
    </script>
  </body>
</html>
